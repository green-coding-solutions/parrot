# TIME-NORMALIZED VARIANT. Generated by
#   ./tools/check_blocks.py applications/spreadsheets --normalize-time
# from the recording beside it, and regenerated whenever any app in the
# group is re-recorded - every block is padded to the LONGEST duration of
# that block across the group, so adding or re-recording one app changes
# the padding in all of them.
#
# Same container, same setup-commands, same reference screenshots and the
# same ground truth as usage_scenario.yml; the only difference is which
# .parrot is replayed. Every app is given identical wall clock per block,
# so what differs between them is the energy rather than the time.
name: Parrot time-normalized Apache OpenOffice Calc
author: Didi <didi@green-coding.io>
description: Drives Apache OpenOffice Calc through a 20,000-row ODS using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    setup-commands:
      - command: bash /tmp/repo/applications/spreadsheets/openoffice/install.sh
      # VCLSalFrame.DocumentWindow, not what xprop shows you.
      #
      # fluxbox evaluates an [app] rule when the window is MAPPED, and at that
      # moment AOO's res_name is `VCLSalFrame.DocumentWindow`. The settled window
      # reports plain `VCLSalFrame`, so a rule written against the property you
      # read off a running application matches nothing at all - silently, leaving
      # the window unpinned and every reference screenshot at the wrong size.
      # This cost the word processor group a pass; the string below is the one
      # that was measured to work.
      - command: bash /tmp/repo/applications/spreadsheets/common/pin-windows.sh VCLSalFrame.DocumentWindow 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/spreadsheets/openoffice/openoffice-normalized.parrot
        read-notes-stdout: true
