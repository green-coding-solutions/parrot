# Per-app values and actions for common/drive-scenario.sh.
# Every landmark here was measured against a live window; see MEASUREMENTS.md.

CLASS=vlc            # WM_CLASS(STRING) = "vlc", "vlc"; the main window carries
                     # WM_WINDOW_ROLE "vlc-main", which is what scopes the pin.
WANT_W=1440
WANT_H=900

# The seek bar, measured by clicking at known x on the 15 s clip 02:
#
#   x=400 -> 00:00:03.850     x=1200 -> 00:00:12.967
#
# which is 0.011396 s/px, so t=0 sits at x=62 and 15 s ends at x=1378. The
# cleanest fit in the group: predicted 8.41 at x=800 against 8.400 measured, 0.43
# at x=100 against 0.450, and 14.91 at x=1370 against 14.883.
BAR_X0=62
BAR_X1=1378
BAR_Y=856

LOAD_WAIT=18

PARK_X=1420
PARK_Y=400

# --- the actions ----------------------------------------------------------

dismiss_startup() { :; }   # no first-run dialog once --no-qt-privacy-ask is set,
                           # and VLC does not auto-select a subtitle track: its
                           # Sub Track menu reads "Disable" on arrival, so unlike
                           # Totem and Parole this entrant needs nothing here.

do_pause()  { K space; }
do_resume() { K space; }

do_seek_back() { K Left; }
do_seek_fwd()  { K Right; }

bar_click() { CLICK "$1" "$2" 0.7 1.6; }

do_volume_down() { X key --repeat 10 --repeat-delay 100 ctrl+Down; sleep 1; }
do_volume_up()   { X key --repeat 10 --repeat-delay 100 ctrl+Up;   sleep 1; }

do_mute()   { K m; }
do_unmute() { K m; }

# Subtitle -> Sub Track -> Disable / Track 1 [English] / Track 2 [German].
# Checked while PAUSED, which is the state this block runs in: the track menus
# stay enabled. That is not true of the Video menu - see the aspect note below.
do_subs_german() { CLICK 266 10 0.8 1.5; CLICK 280 60 0.8 1.5; CLICK 470 109 0.8 2.0; }
do_subs_off()    { CLICK 266 10 0.8 1.5; CLICK 280 60 0.8 1.5; CLICK 470 60  0.8 2.0; }

# Audio -> Audio Track -> Track 2 [German].
do_audio_german() { CLICK 150 10 0.8 1.5; CLICK 200 34 0.8 1.5; CLICK 420 83 0.8 2.0; }

# ASPECT GOES THROUGH THE KEY, NOT THE MENU, and that is forced rather than
# chosen. With playback paused - which is how this block arrives - VLC greys out
# Zoom, Aspect Ratio, Crop, Deinterlace and Take Snapshot in its Video menu.
# Resume and they enable again. `a` works either way.
#
# `a` cycles Default -> 1:1 -> 4:3 -> 16:9 -> 16:10 -> 221:100 -> 235:100 ->
# 239:100 -> 5:4 -> Default, read off VLC's own OSD one press at a time. So 4:3
# is two presses out, and getting back to Default is seven more rather than two.
do_aspect_43()     { X key --repeat 2 --repeat-delay 700 a; sleep 2; }
do_aspect_source() { X key --repeat 7 --repeat-delay 700 a; sleep 2; }

do_fullscreen_on()  { K f; }
do_fullscreen_off() { K Escape; }

# `n` and `p` move one clip and leave it playing - measured: after `n` clip 03
# read 00:00:05.233 and then 00:00:12.267 five seconds later, and `p` went 03 ->
# 02 -> 01 one clip per press, without the restart-the-current-clip step Totem's
# `b` does first.
do_next() { K n; }
do_prev() { K p; }
