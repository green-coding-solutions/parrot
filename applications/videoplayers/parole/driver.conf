# Per-app values and actions for common/drive-scenario.sh.
# Every landmark here was measured against a live window; see MEASUREMENTS.md.

CLASS=parole         # WM_CLASS(STRING) = "parole", "Parole"
WANT_W=1440
WANT_H=900

# The seek bar, measured by clicking at known x on the 50 s clip 01 and reading
# the burnt-in timecode back:
#
#   x=400 -> 00:00:09.600     x=1000 -> 00:00:36.433
#
# which is 0.044722 s/px, so t=0 sits at x=185 and 50 s ends near x=1303.
# Confirmed at x=700: predicted 23.03, measured 23.000.
#
# Absolute and idempotent - three clicks at x=800 all landed on 00:00:05.667 on
# the short clip - though the landing snaps to a keyframe, which is why the same
# measurement taken on the 15 s clip fitted badly and had to be redone on the
# long one where the keyframes are closer together in relative terms.
BAR_X0=185
BAR_X1=1303
BAR_Y=878

LOAD_WAIT=20

PARK_X=1420
PARK_Y=400

# --- the actions ----------------------------------------------------------
#
# EVERY MENU HERE IS DRIVEN WITH THE KEYBOARD, and that is the fix for the one
# recording in the group that would not replay at all.
#
# xmacrorec2 does not report the pointer's arrival when it happens - it reports
# it about 25 us before the next button press. So the 0.8 s that CLICK dwells
# over a target while recording is folded into the wait BEFORE the move and is
# not replayed: on replay the pointer teleports onto a menu item and clicks in
# the same instant. A GTK submenu that had opened on hover during the recording
# is therefore not open when the replay clicks into it. Measured on this entrant:
# the click for Video -> Subtitles -> None missed, the menu kept its grab, and
# the Space and the seek that came next went into the menu instead of the player.
# Block 1 captured 00:00:38.367 of a clip that should have been at 00:00:00.000.
#
# Key events carry their own timings through the recording unchanged, so a menu
# walked with Down / Right / Return replays exactly as it was recorded. Only the
# ONE click that opens the menu bar is left, and a menu bar has no submenu to
# wait for.

dismiss_startup() { :; }    # install.sh turns subtitles off through xfconf

do_pause()  { K space; }
do_resume() { K space; }

# Left and Right are roughly -10 s and +10 s here - measured 00:00:09.967 -> 0
# and 0 -> 00:00:09.583, the landings snapped to keyframes.
do_seek_back() { K Left; }
do_seek_fwd()  { K Right; }

# ONLY WHILE PAUSED, AND CLICKED TWICE.
#
# Parole's control bar auto-hides and slides back in when the pointer moves, and
# a click that arrives during that slide lands on the video instead. Measured: a
# bar click sent 0.8 s after the pointer reached the bar while the clip was
# PLAYING did nothing at all, while the same click while paused landed on
# 00:00:16.900 three times running. Every seek the script asks for is taken from
# a paused player, which is why none of the closing seeks resume first.
#
# The second click is what makes it survive REPLAY, and it was paid for. While
# recording, CLICK dwells 0.8 s over the bar before pressing - but xmacrorec2
# does not report the pointer arriving when it happens, it reports it about 25 us
# before the button press, so that dwell is folded into the wait BEFORE the move
# and is never replayed. On replay the pointer teleports onto the bar and clicks
# in the same instant, and block 2 came back at 00:00:10.100 - exactly where
# playback had stopped - against a reference of 00:00:16.900. The seek simply had
# not happened.
#
# A seek to an absolute position is idempotent, so a second click cannot
# overshoot: if the first lands, the second is a no-op on a position it already
# set; if the first is swallowed by chrome that was not ready, the second lands.
# Totem has needed the same treatment for the same reason since its first
# recording.
bar_click() {
    X mousemove "$1" "$2"; sleep 0.8
    X click 1; sleep 1.2
    X click 1; sleep 1.8
}

# The Audio menu lists Volume Up as `+`, Volume Down as `-` and Mute as `0`.
do_volume_down() { X key --repeat 12 --repeat-delay 100 minus; sleep 1; }
do_volume_up()   { X key --repeat 12 --repeat-delay 100 plus;  sleep 1; }

do_mute()   { K 0; }
do_unmute() { K 0; }

# The two combo boxes in the track bar under the menu: Audio Track at 138,49 and
# Subtitles at 314,49. One click opens either, and the rows are then walked with
# arrow keys rather than clicked.
#
# Arrow keys are what makes this safe. A GTK combo popup aligns its CURRENT
# selection under the pointer, so a row's position depends on the state the combo
# was opened in - measured the hard way: rows read English at y=52 and German at
# y=81 while English was selected, and a recording that reached the block with
# something else showing clicked y=81 and got English. Arrows are relative to the
# selection, and the driver always knows the selection because it set it.
#
# The Subtitles combo lists None, English, German - it does list None, contrary
# to an earlier note here; what was missing before was the None STATE, because
# Parole had auto-selected English. With subtitles off at startup the combo
# arrives on None, so German is two Downs and back to None is two Ups.
do_subs_german() { CLICK 314 49 0.8 1.5; K Down; sleep 0.8; K Down; sleep 0.8; K Return; sleep 2; }
do_subs_off()    { CLICK 314 49 0.8 1.5; K Up;   sleep 0.8; K Up;   sleep 0.8; K Return; sleep 2; }

# Two tracks, arriving on English, so German is one Down.
do_audio_german() { CLICK 138 49 0.8 1.5; K Down; sleep 0.8; K Return; sleep 2; }

# Video -> Aspect Ratio -> the submenu, walked with keys. The Video menu is
# Fullscreen, Aspect Ratio, Subtitles, so the submenu is Down Down Right; the
# submenu is None, Auto, Square, 4:3 (TV), 16:9, 20:9.
#
# HOME FIRST, and it is not decoration. A submenu opened with Right does not
# start on its first row - measured: one Down landed on Auto, which is the row
# the radio group already had selected, not on None. So the count would depend on
# the state, which is the same trap the combos set. Home moves to the first row
# whatever is selected, and the count after it is fixed.
aspect_menu() {
    CLICK 210 10 0.8 1.2
    K Down; sleep 0.5; K Down; sleep 0.5; K Right; sleep 1.2
    K Home; sleep 0.6
}
aspect_pick() { local i; for ((i = 0; i < $1; i++)); do K Down; sleep 0.5; done; K Return; sleep 2; }
do_aspect_43()     { aspect_menu; aspect_pick 3; }   # None -> Auto -> Square -> 4:3
do_aspect_source() { aspect_menu; aspect_pick 1; }   # None -> Auto

do_fullscreen_on()  { K F11; }
do_fullscreen_off() { K F11; }

# The transport buttons, because Parole binds no keys to next and previous track.
# The new clip arrives PLAYING - measured: after the next button clip 02 read
# 00:00:03.400 and then 00:00:10.450 five seconds later.
do_next() { CLICK 92 878 0.8 2.0; }
do_prev() { CLICK 24 878 0.8 2.0; }
