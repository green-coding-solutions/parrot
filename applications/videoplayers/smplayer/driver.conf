# Per-app values and actions for common/drive-scenario.sh.
# Every landmark here was measured against a live window; see MEASUREMENTS.md.

CLASS=smplayer       # WM_CLASS(STRING) = "smplayer", "smplayer"
WANT_W=1440
WANT_H=900

# The seek bar, measured by clicking at known x on the 50 s clip 01 and reading
# the burnt-in timecode back:
#
#   x=500 -> 00:00:12.733     x=1100 -> 00:00:44.167
#
# which is 0.05239 s/px, so t=0 sits at x=257 and 50 s ends near x=1211.
#
# The landings are not exactly linear - 800 predicted 28.45 and measured 28.100 -
# because the seek snaps to a keyframe. That is fine: three clicks at the same x
# gave 00:00:23.600 every time, so it is deterministic, which is what a recording
# needs. It is not exact, which is why the fractions in script.md are described as
# a quarter and a half rather than as timestamps.
BAR_X0=257
BAR_X1=1211
BAR_Y=849

LOAD_WAIT=20

PARK_X=1420
PARK_Y=400

# --- the actions ----------------------------------------------------------
#
# Keys are SMPlayer's own, read out of /usr/share/smplayer/shortcuts/default.keys
# rather than guessed, and then checked against the running program.

dismiss_startup() { :; }

# The action is called `pause` and is bound to Space, but it TOGGLES - measured:
# space paused at 00:00:14.700, the clip was still there four seconds later, and
# a second space resumed it.
do_pause()  { K space; }
do_resume() { K space; }

do_seek_back() { K Left; }          # rewind1
do_seek_fwd()  { K Right; }         # forward1

# A plain left click on this Qt slider seeks absolutely and idempotently - three
# clicks at x=700 all landed on 00:00:23.600 - so no middle-click trick is
# needed here.
bar_click() { CLICK "$1" "$2" 0.7 1.8; }

# decrease_volume is 9 and increase_volume is 0, the same keys mpv uses. The step
# is SMPlayer's own, so the count differs from mpv's; nothing in a checkpoint
# depends on the level.
do_volume_down() { X key --repeat 19 --repeat-delay 80 9; sleep 1; }
do_volume_up()   { X key --repeat 19 --repeat-delay 80 0; sleep 1; }

do_mute()   { K m; }
do_unmute() { K m; }

# next_subtitle is J and cycles off -> English -> German -> off, measured by
# reading the rendered line: "English subtitle 3", "Deutscher Untertitel 3",
# nothing. next_audio is K.
do_subs_german() { K j; sleep 1; K j; }
do_subs_off()    { K j; }

do_audio_german() { K k; }

# `A` is next_aspect and cycles through eleven ratios, so the driver uses the
# menu instead: Video at 124,10 -> Aspect ratio at 210,184 -> the submenu, whose
# Auto row sits at the parent's own y and 4:3 four rows below.
#
# The submenu opens on a CLICK. A hover left the parent row highlighted and the
# submenu shut, twice.
do_aspect_43()     { CLICK 124 10 0.8 1.5; CLICK 210 184 0.8 1.5; CLICK 520 259 0.8 2.0; }
do_aspect_source() { CLICK 124 10 0.8 1.5; CLICK 210 184 0.8 1.5; CLICK 520 184 0.8 2.0; }

do_fullscreen_on()  { K f; }
do_fullscreen_off() { K f; }

# play_next is `>` and play_prev is `<`. Unlike mpv and Celluloid, the new clip
# arrives PLAYING - measured: after `>` clip 02 read 00:00:03.367 and then
# 00:00:11.217 five seconds later - so there is no space afterwards.
# Block 1 clicks LEFT of the bar's zero, not on it. A click at BAR_X0 itself
# lands on the keyframe at 00:00:01.500 - deterministic, but not the start - while
# x=220 measured 00:00:00.000, because a click short of the trough clamps. The
# other entrants land on 0.000, and blocks 2 and 3 are more comparable if this one
# does too.
do_seek_start() { bar_click 215 "$BAR_Y"; }

do_next() { K shift+period; }
do_prev() { K shift+comma; }
