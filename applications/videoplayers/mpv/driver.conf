# Per-app values and actions for common/drive-scenario.sh.
# Every landmark here was measured against a live window; see MEASUREMENTS.md.

CLASS=mpv            # WM_CLASS(STRING) = "mpv", "mpv"
WANT_W=1440          # pinned by common/pin-windows.sh
WANT_H=900           # mpv alone would size the window to the video, 1440x810

# The OSC seek bar, measured by clicking at known x and reading the clip's own
# burnt-in timecode back off the frame:
#
#   x=400 -> 00:00:04.967      x=800 -> 00:00:23.900
#
# which is 0.04733 s/px, so t=0 sits at x=295 and the 30 s clip ends at x=929.
# Confirmed at x=600: predicted 14.44 s, measured 14.433 s.
#
# The bar's ends do not move between clips even though their durations differ:
# its width is set by the elapsed and remaining labels either side of it, and
# every clip in the corpus is under a minute, so both labels are eight
# characters wide throughout.
BAR_X0=295
BAR_X1=929
BAR_Y=880

LOAD_WAIT=12

# mpv has no window chrome at all - the OSC is drawn INTO the video frame by a
# Lua script and fades out about a second after the pointer stops. Parking at the
# top-right corner is far enough from it that every capture is taken faded.
PARK_X=1430
PARK_Y=8

# --- the actions ----------------------------------------------------------
#
# mpv is the keyboard entrant: there is no menu bar to click and no file dialog,
# so every one of these is a binding out of mpv's own built-in input.conf.

dismiss_startup() { :; }                      # no first-run dialog

# Space is a TOGGLE - mpv has no separate play and pause keys - so these two are
# the same keystroke and the driver's block order is what keeps them honest.
do_pause()  { K space; }
do_resume() { K space; }

do_seek_back() { K Left; }                    # seek -5
do_seek_fwd()  { K Right; }                   # seek  5

# The OSC has to be on screen before its bar can be clicked, and it appears on
# pointer movement; CLICK moves first and then waits, which is enough.
bar_click() { CLICK "$1" "$2" 0.8 1.5; }

# `9` is `add volume -2`, so 38 presses take the default 100 down to 24 - "about
# a quarter". There is no coarser volume binding and no volume slider in the
# OSC, so this is the only route mpv offers.
do_volume_down() { X key --repeat 38 --repeat-delay 60 9; sleep 1; }
do_volume_up()   { X key --repeat 38 --repeat-delay 60 0; sleep 1; }

do_mute()   { K m; }
do_unmute() { K m; }

# `j` is `cycle sub`, and with --sid=no the cycle starts at "no": one press
# selects track 1 (eng), two selects track 2 (ger), a third returns to "no".
# Measured off the OSC's subtitle indicator: -/2 -> 1/2 -> 2/2 -> -/2.
do_subs_german() { K j; sleep 1; K j; }
do_subs_off()    { K j; }

# `#` is `cycle audio`; one press moves from the English stereo track to the
# German 5.1 one. xdotool spells it "numbersign".
do_audio_german() { K numbersign; }

# `A` is `cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"`. The
# corpus is 16:9, so the first press is a no-op on screen and the second is the
# one that pillarboxes; two more return to the container's own aspect.
do_aspect_43()     { K shift+a; sleep 1; K shift+a; }
do_aspect_source() { K shift+a; sleep 1; K shift+a; }

# The window is already an undecorated 1440x900 at 0,0, so fullscreen changes no
# pixels in this entrant - it is still a real state change and mpv still sets
# _NET_WM_STATE_FULLSCREEN, but blocks 13 and 14 will look identical to their
# neighbours here in a way they do not in the entrants that have chrome to hide.
do_fullscreen_on()  { K f; }
do_fullscreen_off() { K f; }

# playlist-next does NOT resume: mpv's pause is a global property, so `>` from a
# paused clip lands paused on the next one. Measured - the OSC showed the play
# triangle on 02-h264-1440x810p60 at 00:00:00 after the press. The space is what
# makes do_next leave the clip playing, which is what drive-scenario.sh requires.
do_next() { K shift+period; sleep 3; K space; }
do_prev() { K shift+comma;  sleep 3; K space; }
