# Per-app values and actions for common/drive-scenario.sh.
# Every landmark here was measured against a live window; see MEASUREMENTS.md.

CLASS=totem          # WM_CLASS(STRING) = "totem", "Totem"
WANT_W=1440          # pinned by common/pin-windows.sh; Totem maps one window
WANT_H=900

# The seek bar, measured by clicking at known x and reading the clip's own
# burnt-in timecode back off the frame:
#
#   x=250 -> 00:00:02.000      x=1200 -> 00:00:45.933
#
# which is 0.046245 s/px on the 50 s clip, so t=0 sits at x=207 and the bar is
# 1081 px wide, ending at 1288. Confirmed at x=700: predicted 22.80 s, measured
# 22.800 s. A click at x=1290 did nothing at all - past the widget's end - so the
# usable range stops just short of 1288; the script never asks for more than 0.90.
BAR_X0=207
BAR_X1=1288
BAR_Y=869

# Totem's own startup is slow and the launcher then enqueues five more files one
# at a time, a second apart. This has to outlast that, or block 1 runs while the
# playlist is still being built.
LOAD_WAIT=20

# Park over the video, well away from both the header bar and the control bar.
# Not the top-right corner used for mpv: that is Totem's window-control area and
# a pointer resting there raises a tooltip, which is exactly the thing AGENTS.md
# warns can become the reference screenshot.
PARK_X=1430
PARK_Y=300

# --- the actions ----------------------------------------------------------
#
# Keyboard where Totem documents a binding, menu where it does not. The bindings
# are from Totem's own Shortcuts window, read off the screen rather than from
# documentation, and two of them are traps:
#
#   * PLAIN SPACE IS NOT PLAY/PAUSE. Totem binds P, K and Ctrl+Space. Space
#     activates whatever GTK widget holds the focus, which at startup is a
#     transport button - so a space sent as "pause" advanced the playlist
#     instead. That is worse than a no-op: it is a plausible-looking wrong
#     action, and only the burnt-in clip label showed it.
#   * RIGHT IS +60 SECONDS, not the mirror of Left's -15. On a 15-second clip
#     that runs off the end and advances the playlist. Shift+Right is the +15 s
#     binding and is what this driver uses.

# THE POPOVER ROWS ARE REACHED WITH Tab, NOT WITH COORDINATES, AND THAT IS THE
# MOST IMPORTANT THING IN THIS FILE.
#
# Both popovers used to be driven by clicking a measured row position. That is
# what produced every "Totem is broken" note this file used to carry, and the
# mechanism is worth writing down because nothing in the logs shows it.
#
# TOTEM'S MAIN MENU HAS "Keyboard Shortcuts" IN IT, four rows down. The aspect
# submenu is opened by clicking the "Aspect Ratio" row and then clicking the
# wanted ratio in the submenu that replaces it. If the first click is swallowed -
# and clicks into a popover that is still animating are swallowed - the submenu
# never opens, and the second click, aimed at the submenu's "4:3 (TV)", lands on
# the main menu's "Keyboard Shortcuts" instead. Measured directly: click the menu
# button, click 1240,167 without opening the submenu, and
#
#   visible totem windows: [01-h264-1440x900p30] [Videos]
#   focused: Videos
#
# A second top-level window opens - GTK's shortcuts window, which reports itself
# as "Videos" - and IT TAKES THE KEYBOARD. Every key the driver sends afterwards
# is typed into its search box; `p`, `n`, `f` and the arrows never reach the
# player again. The player carries on alone, reaches the end of the clip, and
# advances. From the outside that looks exactly like "the video output died while
# the title bar kept moving", which is what it was called for a long time. It was
# never a defect in Totem. Six `p` presses later the shortcuts window was sitting
# there with "pppppp" in its search field and "No Results Found" under it.
#
# The submenu's rows are not even at a fixed place: captured across runs the same
# "4:3 (TV)" row was at y=126 in one and y=167 in another, because the popover is
# sized and positioned per opening. So there is no coordinate to get right.
#
# Tab has none of these problems. Focus moves one row per Tab from a known start,
# so a step that does not land leaves the selection short rather than somewhere
# destructive, and there is no coordinate at all. Measured, both popovers:
#
#   languages   0 English audio (initial focus)   1 German audio
#               2 Subtitles None   3 Subtitles English   4 Subtitles German
#               5 Select Text Subtitles...  <- opens a file chooser, never use
#   aspect      1 Auto   2 Square   3 4:3 (TV)   4 16:9   5 2.11:1
#
# The aspect submenu is opened by CLICKING its row and then counted in Tabs, and
# the split is deliberate. The MAIN menu's rows do not move - "Aspect Ratio" is
# the first row at y=83 in every capture - so a click there is safe, and a click
# that misses opens nothing. It is only the SUBMENU's rows that shift between
# openings, and those are the ones Tab handles.
#
# Down then Return was tried first for the outer row and is worse, because it is
# ambiguous: the popover sometimes opens with focus already on "Aspect Ratio" and
# sometimes above it, so Down lands on the row in one case and on Preferences in
# the other. Return on the submenu's own header row is its BACK button, which is
# how the plain arrow-key attempt failed before Tab was tried.
#
# Escape closes the popover afterwards. Escape was previously blamed for the lost
# video output; that was the shortcuts window all along. It is safe here because
# blocks 8 to 12 are windowed, and Totem binds Escape to "Exit fullscreen" - so
# on an already-closed popover it does nothing at all.
lang_menu() { CLICK 1247 22 0.8 1.5; }
lang_pick() {
    local i
    for ((i = 0; i < $1; i++)); do K Tab; sleep 0.5; done
    K Return; sleep 2
    # The settle after the popover closes is 2.5 s and not 1.2 s because the
    # FIRST click after a popover is the one Totem eats. Block 9 is
    # do_subs_off followed immediately by a bar click, and with the shorter
    # settle that click was lost in one recording out of several - leaving
    # block 9 on block 8's frame, which then fails on replay.
    K Escape; sleep 2.5
}
aspect_menu() { CLICK 1289 22 0.8 2.0; CLICK 1250 83 0.8 2.0; }
aspect_pick() {
    local i
    for ((i = 0; i < $1; i++)); do K Tab; sleep 0.5; done
    K Return; sleep 2
    K Escape; sleep 1.2
}

dismiss_startup() {
    # Totem selects the first subtitle track even though the corpus flags neither
    # track default, so this entrant arrives at block 2 with English subtitles
    # drawn while the others have none. mpv solves the same problem with
    # --sid=no; Totem has no equivalent option, so the driver turns them off
    # here. It costs this entrant two menu clicks in block 1 that mpv does not
    # pay, which is the honest price of getting both to the same state.
    lang_menu; lang_pick 2         # Subtitles -> None
}

do_pause()  { K p; }
do_resume() { K p; }

do_seek_back() { K Left; }         # -15 s
do_seek_fwd()  { K shift+Right; }  # +15 s

# Six rewind presses, not the default twelve. Block 13's absolute seek holds the
# backward key down until the position clamps at the start, and the count only
# has to cover the 50 s of clip 01 with the entrant's own step - which is 15 s
# here, the largest in the group, so six is already 90 s. This entrant seeks
# slowly and ignores input that arrives while a seek is in flight, so the extra
# presses would be churn rather than margin.
REWIND_PRESSES=6

# The control bar auto-hides, and getting a click onto it took three attempts.
#
# A single move-then-click is not enough: block 1's seek back to the start left
# the clip at 00:00:36.400 instead of 00:00:00.000, because the click landed on
# the video before the bar had appeared - and a click on Totem's video area
# toggles play/pause, so it did something rather than nothing.
#
# Waking the bar by moving onto it and waiting was worse: the FIRST bar click of
# a recording worked and every later one did nothing at all. Measured directly -
# clicks at x=450 and x=950 both left the position at the 22.800 s the first
# click had set.
#
# What works is moving over the VIDEO first and then onto the bar, because the
# chrome is revealed by motion over the video, not by the pointer's arrival on
# the bar. Four consecutive seeks with this sequence all landed:
#
#   x=1018 -> 00:00:37.533   x=613 -> 00:00:18.767
#   x=477  -> 00:00:12.500   x=207 -> 00:00:00.033
#
# which also confirms the left edge is fine and matches the mapping above to
# within a frame.
# The click is sent TWICE at the same coordinates, and that is deliberate. A
# single click is not reliable here: across two otherwise identical recordings
# one lost the third click of block 4, leaving the position at the midpoint
# instead of the quarter mark. A seek to an absolute position is idempotent - if
# both clicks land, the second is a no-op on a position the first already set;
# if the first is swallowed by the chrome not being ready, the second lands. It
# cannot overshoot the way a repeated relative seek would.
# The waits are long because this entrant seeks slowly and ignores a click that
# arrives while a seek is still in flight. Block 4 lost its third click twice
# with shorter ones, leaving the position at the midpoint instead of the quarter
# mark - which then pushed every later block 12.5 s down clip 01 until block 13
# ran off its end and the playlist advanced early.
bar_click() {
    X mousemove 720 400; sleep 0.8
    X mousemove "$1" "$2"; sleep 0.8
    X click 1; sleep 1.5
    X click 1; sleep 3.0
}

do_volume_down() { X key --repeat 8 --repeat-delay 120 Down; sleep 1; }
do_volume_up()   { X key --repeat 8 --repeat-delay 120 Up;   sleep 1; }

do_mute()   { K m; }
do_unmute() { K m; }

# The languages and subtitles popover, button at 1247,22, rows counted in Tabs
# from the table above.
do_subs_german() { lang_menu; lang_pick 4; }
do_subs_off()    { lang_menu; lang_pick 2; }
do_audio_german(){ lang_menu; lang_pick 1; }

# The aspect submenu, reached from the main menu at 1289,22 and then counted in
# Tabs. Selecting a radio row does not close a GTK popover, so both of these end
# on the Escape inside aspect_pick.
do_aspect_43()     { aspect_menu; aspect_pick 3; }
do_aspect_source() { aspect_menu; aspect_pick 1; }

do_fullscreen_on()  { K f; }
do_fullscreen_off() { K Escape; }

# `n` and `b` leave the new clip PLAYING - measured: after `n` the next clip read
# 00:00:04.517 and then 00:00:11.100 five seconds later. So unlike mpv, which
# inherits the paused state and needs a space afterwards, these are single keys.
# Block 1 has to land on the same frame every run, and in this entrant that took
# three attempts.
#
#   * a click at the left end of the position bar: failed in four consecutive
#     recordings, all of them leaving block 1 at ~00:00:36.9. The control bar
#     auto-hides and the first click after a menu is eaten by the popover grab.
#   * `b`, which restarts the current clip: measured to work from a PLAYING clip,
#     and measured to do nothing here, because block 1 pauses first.
#   * five presses of Left, which is what this is. Each is -15 s and the seek
#     CLAMPS at zero, so from anywhere inside a 50-second clip five of them land
#     on exactly 00:00:00.000 - no chrome to wait for, no dependence on how long
#     the entrant took to start, and exact rather than approximately exact.
#
# The clamp is the point: it turns "wherever startup left us" into a fixed frame
# without needing to know where that was.
do_seek_start() { X key --repeat 5 --repeat-delay 400 Left; sleep 2; }

# ADVANCING THE PLAYLIST WITH THE SUBTITLE TRACK DISABLED KILLS TOTEM'S VIDEO
# OUTPUT, PERMANENTLY. This is the defect that cost the most to find, and it is
# Totem's own, not the driver's.
#
# Minimal reproduction, from a fresh container:
#
#   1. open the six-clip playlist
#   2. Subtitles -> None
#   3. press `n`
#
# The title bar advances, audio keeps playing, and NOTHING in the window is ever
# repainted again - not the video, not the control bar. The GTK main loop is
# still alive: `n` keeps moving the playlist on and the title keeps changing.
# Nothing recovers it - measured: seek, play/pause, a fullscreen cycle, moving
# the window, resizing it, and minimise-plus-restore all leave it dead.
#
# It was bisected to exactly one action, by running each of them alone before a
# playlist advance and asking only whether the picture still moved:
#
#   nothing before the advance      repaint 0.403   alive
#   AUDIO track changed             repaint 0.380   alive
#   ASPECT changed there and back   repaint 0.375   alive
#   SUBTITLES set to None           repaint 0       DEAD
#   None, then switched back on     repaint 0.290   alive
#
# So it is not the menu, not the route, and not fullscreen - an earlier note in
# this file blamed a subtitle change PLUS a fullscreen cycle, and the fullscreen
# half was never needed. It is the disabled subtitle track at the moment the
# playlist changes.
#
# That also explains why every recording died at block 15 and not before:
# dismiss_startup turns subtitles off in block 1, so the player is already
# poisoned, and block 15 is simply the first block that advances the playlist.
#
# The guard is Shift+V, Totem's own "Toggle subtitles" binding, wrapped around
# every playlist change. Two keystrokes and about three seconds, against four
# menu clicks and twelve seconds for the same thing through the popover -
# measured both ways, three consecutive advances each, and both work:
#
#   Shift+V guard   02, 03, 04 in order   repaint 0.410, 0.411, 0.412
#
# The cost is real and belongs in the numbers: blocks 15 to 19 cost this entrant
# two extra keystrokes each that no other entrant pays. The subtitles are off
# again before the checkpoint, so the reference images still match the rest.
subs_guard_on()  { K shift+v; sleep 1.5; }
subs_guard_off() { K shift+v; sleep 1.5; }

# Block 21's advance happens on its own, inside a sleep, so it is guarded from
# the shared driver through these two hooks rather than from do_next.
autoadvance_guard_on()  { subs_guard_on; }
autoadvance_guard_off() { subs_guard_off; }

do_next() { subs_guard_on; K n; sleep 2; subs_guard_off; }

# `b` RESTARTS THE CURRENT CLIP before it goes anywhere. Measured from clip 03
# partway in: the first `b` left the title on 03, the second moved it to 02. So
# previous-track is two presses here, where in mpv it is one.
do_prev() { subs_guard_on; K b; sleep 3; K b; sleep 2; subs_guard_off; }
