# GENERATED by tools/make_block_scenarios.py from usage_scenario_normalized.yml. Do not edit:
# change that file or the recording, then rerun the tool.
#
# Replays okular-normalized.parrot one block per flow step, so every block
# of the group's script.md is a GMT phase of its own. Block 1 starts the app;
# every later block continues it as the block before left it (replay.py --block).
#
name: Parrot Okular (time-normalized, per block)
author: Didi <didi@green-coding.io>
description: Drives Okular through the same thirteen-block document session, time-normalized so every block lasts as long as the slowest entrant's. Every block is its own flow step


services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    # volumes:
    #   - .:/save_dir
    #   - /tmp/parrot-debug:/debug   # remove when not debugging
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      # PARROT_DEBUG_DIR: /debug


    setup-commands:
      - command: apt update
      - command: apt-get install -y --no-install-recommends okular=4:23.08.5-0ubuntu5
      - command: bash /usr/local/bin/entrypoint.sh
      - command: ln -s /tmp/repo/applications/pdf_viewers/20yearsofKDE.pdf /tmp/pdf.pdf # The path rending in the open dialog changes depending on the files so this makes is more fail safe

flow:
  - name: Load app
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 1
        read-notes-stdout: true
  - name: Open the document 20yearsofKDE.pdf from the local disk
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 2
        read-notes-stdout: true
  - name: Jump to page 81 by entering the page number
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 3
        read-notes-stdout: true
  - name: Highlight text of last paragraph on page 81
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 4
        read-notes-stdout: true
  - name: Rotate the page right
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 5
        read-notes-stdout: true
  - name: Zoom in to 200 percent
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 6
        read-notes-stdout: true
  - name: Zoom out to 50 percent
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 7
        read-notes-stdout: true
  - name: Go back 4 pages page by page
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 8
        read-notes-stdout: true
  - name: Rotate the page left
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 9
        read-notes-stdout: true
  - name: Zoom to 150 percent
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 10
        read-notes-stdout: true
  - name: Jump to page 95 by entering the page number
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 11
        read-notes-stdout: true
  - name: Highlight the text of the title
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 12
        read-notes-stdout: true
  - name: Go forward 14 pages page by page
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/okular/okular-normalized.parrot --block 13
        read-notes-stdout: true
