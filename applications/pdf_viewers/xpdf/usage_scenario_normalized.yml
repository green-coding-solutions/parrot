name: Parrot xpdf (time-normalized)
author: Didi <didi@green-coding.io>
description: Drives xpdf through the same thirteen-block document session, time-normalized so every block lasts as long as the slowest entrant's


services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    # volumes:
    #   - .:/save_dir
    #   - /tmp/parrot-debug:/debug   # remove when not debugging
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      WINDOW_X: -1
      WINDOW_Y: 0
      WINDOW_WIDTH: 1440
      WINDOW_HEIGHT: 853
      # xpdf's Motif shell re-grows itself to 1440x856 after position-window pins
      # 1440x853, on the current image as on the cluster; the references are 853.
      # Scaling the capture back to 853 keeps the checks running (worst RMSE
      # 0.16, zoom 200 %, verified 2026-09-29) instead of failing at block 1.
      CHECK_SCALE_ON_MISMATCH: 1

    setup-commands:
      - command: apt update
      - command: apt-get install -y --no-install-recommends xpdf=3.04+git20240202-1build3
      - command: bash /usr/local/bin/entrypoint.sh
      - command: ln -s /tmp/repo/applications/pdf_viewers/20yearsofKDE.pdf /tmp/pdf.pdf # The path rending in the open dialog changes depending on the files so this makes is more fail safe

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/pdf_viewers/xpdf/xpdf-normalized.parrot
        read-notes-stdout: true
