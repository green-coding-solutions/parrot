name: Parrot Thunderbird (time-normalized)
author: Didi <didi@green-coding.io>
description: Drives Mozilla Thunderbird against a local 500 MB IMAP mailbox using Parrot

# Two containers on a private network.  The mail server is measured separately
# from the client, so its cost does not land in the client's energy figure.
networks:
  parrot-mail:

services:
  # Dovecot (IMAP) + Postfix (submission) serving a deterministic ~500 MB
  # Maildir.  GMT sets services up in `depends_on` order, so this one is fully
  # ready - daemons up, smoke test passed - before the client container is even
  # created.
  #
  # The image carries the whole corpus, so this takes about five seconds rather
  # than the three and a half minutes it costs to generate 13,481 messages.  It
  # also pins the mailbox bytes: the corpus is deterministic for a given machine,
  # but the PNG attachments go through zlib, whose output is not guaranteed
  # identical across zlib versions - baking them means every machine syncs the
  # same mailbox.  Build it with `make mailserver` (see mailserver/Dockerfile).
  #
  # To run from scratch instead - useful when iterating on the corpus itself -
  # swap the image for the pinned ubuntu base and the command for setup.sh:
  #   image: ubuntu@sha256:9cbed754112939e914291337b5e554b07ad7c392491dba6daf25eef1332a22e8
  #   environment:
  #     PARROT_MAIL_TARGET_MB: "100"   # lower = faster while iterating
  #   setup-commands:
  #     - command: bash /tmp/repo/applications/emailclients/mailserver/setup.sh
  mail-container:
    image: ribalba/parrot-mailserver:v1
    networks:
      parrot-mail:
        # Matches the CN of the certificate the server issues itself.
        aliases:
          - mail.parrot.test
    setup-commands:
      - command: parrot-mailserver-start

  window-container:
    image: ribalba/xwindow-server
    depends_on:
      - mail-container
    networks:
      - parrot-mail
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    # volumes:
    #   - /tmp/parrot-debug:/debug   # remove when not debugging
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      # PARROT_DEBUG_DIR: /debug
      # Deterministic window layout.  Uncomment and set APP_WINDOW_CLASS to the
      # client's WM_CLASS before recording: several of these clients open a small
      # or oddly-sized window on first run, and click coordinates plus reference
      # screenshots are only reproducible if the window is the same size on every
      # replay.  See "Deterministic Window Layout" in the top-level README.
      # AUTO_POSITION: "1"
      # WINDOW_X: "20"
      # WINDOW_Y: "20"
      # WINDOW_WIDTH: "1400"
      # WINDOW_HEIGHT: "860"

    setup-commands:
      - command: bash /tmp/repo/applications/emailclients/common/client-setup.sh
      - command: bash /tmp/repo/applications/emailclients/thunderbird/install.sh
      - command: bash /tmp/repo/applications/emailclients/common/seed-mozilla-profile.sh /root/.thunderbird parrot
      # Restores thunderbird/profile.tar.gz (4 KB: key4.db, logins.json, cert9.db)
      # over the generated profile.  REQUIRED, not optional - it is the stored IMAP
      # and SMTP password.  Without it Thunderbird opens a password prompt that the
      # macro does not answer, never authenticates, and every screenshot check
      # compares against an empty mailbox.
      - command: bash /tmp/repo/applications/emailclients/common/seed-profile.sh /tmp/repo/applications/emailclients/thunderbird /root
      # Deterministic window geometry.  Must run BEFORE entrypoint.sh: fluxbox
      # reads ~/.fluxbox/apps once at startup and will not replace an existing
      # file.  Runs at replay time too, because setup-commands always do - which
      # is the point, since window management is not captured in the macro.
      - command: bash /tmp/repo/applications/emailclients/common/pin-windows.sh Mail
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      # Same recording as usage_scenario.yml, replayed from the time-normalized
      # copy: tools/check_blocks.py --normalize-time pads every block to the
      # longest that block takes across the group, so the blocks line up for
      # side-by-side comparison.  The actions and their order are unchanged.
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/emailclients/thunderbird/thunderbird-normalized.parrot
        read-notes-stdout: true
