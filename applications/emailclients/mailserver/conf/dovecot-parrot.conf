# Parrot email-client benchmark - Dovecot configuration.
#
# Dropped into /etc/dovecot/conf.d/ as the last file so it overrides the
# Debian defaults.  This server is deliberately permissive: it exists only on
# an internal Docker network with a synthetic corpus, and every mail client
# under test has to be able to connect to it without a human clicking through
# a certificate warning.
#
# NEVER expose this configuration outside the benchmark network.

protocols = imap lmtp

listen = *

# Plaintext auth on port 143 is allowed on purpose.  Several of the clients
# under test cannot be pre-configured for STARTTLS without an interactive
# certificate-trust dialog, which would make the recorded macro diverge
# between clients.  IMAPS on 993 is offered as well; pick per client.
disable_plaintext_auth = no
auth_mechanisms = plain login

# Strip the domain before every passdb AND userdb lookup.  Without this, LMTP
# delivery fails: Postfix hands Dovecot the full "parrot@parrot.test" as the
# recipient, and the system-passwd userdb has no such user - mail bounces with
# "User doesn't exist" even though IMAP logins work fine.
auth_username_format = %n

# Maildir++ is the default layout, so it is deliberately NOT spelled out here.
# Dovecot only accepts the lowercase spelling `LAYOUT=maildir++`; the
# capitalised `LAYOUT=Maildir++` is silently unrecognised and makes INBOX
# resolve to a `.INBOX` child folder instead of the maildir root, which
# presents an empty inbox while every other folder looks fine.
mail_location = maildir:~/Maildir
mail_privileged_group = mail

# The benchmark user is a normal system user.
first_valid_uid = 1000
last_valid_uid = 60000

# Clients open a lot of parallel connections while syncing a large mailbox.
# Thunderbird defaults to 5 per account, Evolution and KMail use more, and the
# Dovecot default of 10 would silently throttle the very thing we measure.
mail_max_userip_connections = 100

# A 500 MB mailbox with ~13.5k messages makes index maintenance visible.
# These are Dovecot's normal production values, stated explicitly so the
# benchmark does not depend on distribution defaults.
mailbox_list_index = yes
mail_cache_min_mail_count = 10
maildir_very_dirty_syncs = yes

ssl = yes
ssl_cert = </etc/dovecot/private/mail.parrot.test.fullchain.crt
ssl_key = </etc/dovecot/private/mail.parrot.test.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no

# username_format=%n strips the domain, so the account can be entered either as
# "parrot" or as "parrot@parrot.test".  Clients differ in what they send.
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%n /etc/dovecot/parrot-users
}

userdb {
  driver = passwd
  args = blocking=no
}

namespace inbox {
  type = private
  separator = .
  inbox = yes

  # SPECIAL-USE flags let every client auto-detect the standard folders
  # instead of asking the user during account setup.
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  service_count = 0
  process_min_avail = 4
}

service imap {
  # One process per connection keeps per-client CPU attribution clean.
  service_count = 1
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# Postfix authenticates submission against Dovecot through this socket.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = dovecot
  }
}

protocol imap {
  mail_max_userip_connections = 100
  imap_idle_notify_interval = 120s
}

protocol lmtp {
  postmaster_address = postmaster@parrot.test
  hostname = mail.parrot.test
}

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot.log
debug_log_path = /var/log/dovecot.log
