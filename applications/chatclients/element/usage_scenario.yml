# RECORDED AND VERIFIED. element.parrot replays 23/23 with a worst RMSE of
# 0.054 against a 0.2 threshold, and the replay's server-side effects were
# checked with matrix-truth.py rather than by eye.
#
# NOTE FOR RUNNING THIS BY HAND: the docker-run-args below make GMT refuse to
# start in CLI mode unless it is given --allow-unsafe. The failure looks like a
# clean run that ends during BOOT with no flow output. See
# ../nheko/MEASUREMENTS.md for the rest of the run flags.
name: Parrot Element Desktop
author: Didi <didi@green-coding.io>
description: Drives Element Desktop through a 23-block Matrix session using Parrot

# Two containers on a private network. The homeserver is measured separately
# from the client, so its cost - including the bot's 24-message burst - does not
# land in the client's energy figure.
networks:
  parrot-matrix:

services:
  # Synapse plus the seeded corpus, and parrot-bot.py listening for the `ping`
  # and `drip` triggers. GMT sets services up in `depends_on` order, so this one
  # is fully ready - daemons up, smoke test passed, bot synced - before the
  # client container is even created.
  #
  # The image carries the whole corpus, so this takes seconds rather than the
  # many minutes it costs to register 500 accounts and write 40,000 events. It
  # also pins the room IDs: those are generated by the server at seeding time
  # and cannot be made deterministic, so a reseed would invalidate the manifest
  # and anything else that names a room.
  #
  # Build it with `make matrixserver` (see matrixserver/Dockerfile).
  matrix-container:
    image: ribalba/parrot-matrixserver:v1
    networks:
      parrot-matrix:
        # Matches PARROT_MATRIX_HOST in account.env and the server_name Synapse
        # was configured with.
        aliases:
          - matrix.parrot.test
    setup-commands:
      - command: parrot-matrixserver-start
      # Must come after the server is up, and must return rather than block -
      # see matrixserver/start-bot.sh for why the bot cannot be a flow command.
      - command: parrot-bot-start

  window-container:
    image: ribalba/xwindow-server
    depends_on:
      - matrix-container
    networks:
      - parrot-matrix
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    # Required, and specific to the two Electron entrants. Docker's default
    # /dev/shm is 64 MB; Chromium maps shared memory for every surface it
    # composites and dies partway through a large room - which looks like the
    # client crashing on scroll-back rather than like a container limit.
    #
    # Raised here rather than papered over with --disable-dev-shm-usage,
    # because that flag moves the allocation to disk and would change what is
    # being measured: disk I/O instead of memory, in the one client where the
    # renderer is the thing under test.
    #
    # GMT gates docker-run-args behind --allow-unsafe in CLI mode ONLY. For a
    # production run, allowlist this string under
    # capabilities.measurement.orchestrators.docker.allowed_run_args.
    docker-run-args:
      - --shm-size=1g

    setup-commands:
      - command: bash /tmp/repo/applications/chatclients/common/client-setup.sh
      - command: bash /tmp/repo/applications/chatclients/element/install.sh
      # NO SESSION SEEDING AND NO keyring.sh. Both were tried on nheko and both
      # are dead ends for every client in this group - see
      # ../nheko/MEASUREMENTS.md rather than rediscovering them here:
      #
      #   * An access token is SERVER state. Logging in writes a row to the
      #     homeserver's database, in the running container, not the image. GMT
      #     rebuilds both containers per run, so a captured profile.tar.gz comes
      #     back to a homeserver that has never heard of the token. Measured on
      #     nheko: "Invalid access token passed. 401". The scenario signs in
      #     itself instead - script.md block 2 - which also gives all six
      #     clients the same block rather than five seeding mechanisms.
      #
      #   * Unlocking a keyring from a setup-command does not reach the
      #     application. That shell has its own DBUS_SESSION_BUS_ADDRESS and the
      #     client launches later on a different bus. The unlock has to happen
      #     inside the same session as the process, which means inside a
      #     launcher wrapper on PATH - see nheko/install.sh for the shape of it.
      #     Element still needs one if it comes up at the login screen after
      #     signing in once; run it and find out.
      # res_name is `element`, read back off the running window:
      #   WM_CLASS(STRING) = "element", "element"
      #
      # NOT `element-desktop`, which is the obvious guess and is wrong. The
      # binary, the package and the PATH command are all element-desktop, and so
      # is the WM_CLASS of Electron's startup ERROR dialog:
      #   [System unsupported] CLASS="element-desktop", "Element-desktop"
      # The main window is plain "element". Guessing element-desktop would have
      # matched only the error dialog, so the main window would never be pinned
      # and every coordinate would drift per run - silently, because a rule that
      # matches nothing applies nothing.
      - command: bash /tmp/repo/applications/chatclients/common/pin-windows.sh element 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/chatclients/element/element.parrot
        read-notes-stdout: true
