# GENERATED by tools/make_block_scenarios.py from usage_scenario_normalized.yml. Do not edit:
# change that file or the recording, then rerun the tool.
#
# Replays intellij-normalized.parrot one block per flow step, so every block
# of the group's script.md is a GMT phase of its own. Block 1 starts the app;
# every later block continues it as the block before left it (replay.py --block).
#
name: Parrot IntelliJ IDEA (time-normalized, per block)
author: Didi <didi@green-coding.io>
description: Drives IntelliJ IDEA through an eighteen-step editing scenario using Parrot. Every block is its own flow step

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    setup-commands:
      - command: bash /tmp/repo/applications/codeeditors/intellij/install.sh
      - command: bash /tmp/repo/applications/codeeditors/common/seed-workspace.sh
      - command: bash /tmp/repo/applications/codeeditors/common/pin-windows.sh jetbrains-idea 1440 900
      # Everything is installed by now, so take the network away.  IDEA queries
      # the JetBrains marketplace the first time it opens a .py file and draws a
      # "Plugins supporting *.py files found" banner across the top of the
      # editor when the query succeeds - one row tall, so every line below it
      # moves down 32 px.  It appears only on a machine that can reach the
      # marketplace, which makes a recording made on a connected machine fail on
      # a disconnected one.
      - command: bash /tmp/repo/applications/codeeditors/common/go-offline.sh
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Load app
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/codeeditors/intellij/intellij-normalized.parrot --block 1
        read-notes-stdout: true
  - name: Open file
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/codeeditors/intellij/intellij-normalized.parrot --block 2
        read-notes-stdout: true
  - name: Scroll to function
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/codeeditors/intellij/intellij-normalized.parrot --block 3
        read-notes-stdout: true
  - name: Find identifier
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/codeeditors/intellij/intellij-normalized.parrot --block 4
        read-notes-stdout: true
  - name: Select line
    container: window-container
    commands:
      - type: console
