name: Parrot Android Studio (time-normalized)
author: Didi <didi@green-coding.io>
description: Drives Android Studio through an eighteen-step editing scenario using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    setup-commands:
      - command: bash /tmp/repo/applications/codeeditors/androidstudio/install.sh
      - command: bash /tmp/repo/applications/codeeditors/common/seed-workspace.sh
      # PLACEHOLDER - replaced once the window's WM_CLASS has been read off a
      # running Android Studio rather than guessed.
      - command: bash /tmp/repo/applications/codeeditors/common/pin-windows.sh jetbrains-studio 1440 900
      - command: bash /tmp/repo/applications/codeeditors/common/go-offline.sh
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      # Same recording as usage_scenario.yml, replayed from the time-normalized
      # copy: tools/check_blocks.py --normalize-time pads every block to the
      # longest that block takes across the group, so the blocks line up for
      # side-by-side comparison.  The actions and their order are unchanged.
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/codeeditors/androidstudio/androidstudio-normalized.parrot
        read-notes-stdout: true
