# GENERATED by tools/make_block_scenarios.py from usage_scenario_normalized.yml. Do not edit:
# change that file or the recording, then rerun the tool.
#
# Replays androidstudio-normalized.parrot one block per flow step, so every block
# of the group's script.md is a GMT phase of its own. Block 1 starts the app;
# every later block continues it as the block before left it (replay.py --block).
#
name: Parrot Android Studio (time-normalized, per block)
author: Didi <didi@green-coding.io>
description: Drives Android Studio through an eighteen-step editing scenario using Parrot. Every block is its own flow step

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    setup-commands:
      - command: bash /tmp/repo/applications/codeeditors/androidstudio/install.sh
      - command: bash /tmp/repo/applications/codeeditors/common/seed-workspace.sh
      # PLACEHOLDER - replaced once the window's WM_CLASS has been read off a
      # running Android Studio rather than guessed.
      - command: bash /tmp/repo/applications/codeeditors/common/pin-windows.sh jetbrains-studio 1440 900
      - command: bash /tmp/repo/applications/codeeditors/common/go-offline.sh
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Load app
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/codeeditors/androidstudio/androidstudio-normalized.parrot --block 1
        read-notes-stdout: true
  - name: Open file
    container: window-container
    commands:
      - type: console
