name: Parrot terminology
author: Didi <didi@green-coding.io>
description: Drives terminology through a sixteen-block terminal session using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    environment:
      RESOLUTION: 1440x900
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    setup-commands:
      - command: bash /tmp/repo/applications/terminals/terminology/install.sh
      # WM_CLASS(STRING) = "main", "terminology" - MEASURED. The res_name is
      # `main`, so that is the pin string; `terminology` would match nothing.
      - command: bash /tmp/repo/applications/terminals/common/pin-windows.sh main 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/terminals/terminology/terminology.parrot
        read-notes-stdout: true
