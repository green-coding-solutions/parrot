# Per-app values for common/drive-scenario.sh.
#
# WM_CLASS(STRING) = "main", "terminology"
# The res_name is `main`, so the fluxbox PIN string is `main` - see
# usage_scenario.yml. xdotool matches res_class, so CLASS here is `terminology`.
CLASS=terminology
WANT_W=1440
WANT_H=900
# EFL brings up its own compositor-side machinery before mapping a window.
LOAD_WAIT=12
