name: Parrot Alacritty
author: Didi <didi@green-coding.io>
description: Drives Alacritty through an eighteen-block terminal session using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    setup-commands:
      - command: bash /tmp/repo/applications/terminals/alacritty/install.sh
      # WM_CLASS(STRING) = "Alacritty", "Alacritty" - note the capital A in
      # BOTH fields, unlike every other entrant. fluxbox's match is
      # case-sensitive, so 'alacritty' here would match nothing at all and
      # silently leave the window unpinned.
      - command: bash /tmp/repo/applications/terminals/common/pin-windows.sh Alacritty 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/terminals/alacritty/alacritty.parrot
        read-notes-stdout: true
