# Per-app values for common/drive-scenario.sh.
#
# WM_CLASS(STRING) = "xterm", "mlterm"
# The res_name is literally `xterm` - mlterm still identifies itself that way for
# the benefit of old resource files. fluxbox matches res_name, so the PIN string
# is `xterm`; xdotool matches res_class, so CLASS here is `mlterm`. This is the
# widest split between the two fields of any entrant in the group.
CLASS=mlterm
WANT_W=1440
WANT_H=900
LOAD_WAIT=8
