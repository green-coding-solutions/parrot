name: Parrot rxvt-unicode
author: Didi <didi@green-coding.io>
description: Drives rxvt-unicode through an eighteen-block terminal session using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    setup-commands:
      - command: bash /tmp/repo/applications/terminals/urxvt/install.sh
      # WM_CLASS(STRING) = "urxvt", "URxvt" - measured. fluxbox matches the
      # res_name, xdotool the res_class; here they differ only in case, which
      # xdotool's match ignores.
      - command: bash /tmp/repo/applications/terminals/common/pin-windows.sh urxvt 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/terminals/urxvt/urxvt.parrot
        read-notes-stdout: true
