name: Parrot GNOME Terminal
author: Didi <didi@green-coding.io>
description: Drives GNOME Terminal through an eighteen-block terminal session using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    setup-commands:
      - command: bash /tmp/repo/applications/terminals/gnome-terminal/install.sh
      # THE WINDOW BELONGS TO gnome-terminal-server, NOT gnome-terminal:
      #   WM_CLASS(STRING) = "gnome-terminal-server", "Gnome-terminal"
      # so the pin rule takes gnome-terminal-server and xdotool takes
      # gnome-terminal. Two different strings for one window, and neither works
      # in the other's place. Measured against a running window.
      - command: bash /tmp/repo/applications/terminals/common/pin-windows.sh gnome-terminal-server 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/terminals/gnome-terminal/gnome-terminal.parrot
        read-notes-stdout: true
