# Per-app values for common/drive-scenario.sh.
# WM_CLASS(STRING) = "gnome-terminal-server", "Gnome-terminal" - the window
# belongs to the SERVER, not to the gnome-terminal client that launched it.
CLASS=gnome-terminal
WANT_W=1440
WANT_H=900
# Has to bring up a session bus and hand off to gnome-terminal-server before a
# window exists, so it needs longer than the raw-Xlib entrants.
LOAD_WAIT=12
