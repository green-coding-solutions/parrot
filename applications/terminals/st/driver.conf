# Per-app values for common/drive-scenario.sh. Measured against a live window;
# see MEASUREMENTS.md.
#
# Identical geometry to xterm, and not by coincidence: both are raw Xlib, both
# render DejaVu Sans Mono at size 11, and both default to a 2px border, so they
# reach the same 9x19 cell by the same arithmetic.
CLASS=st-256color    # st names itself after its TERM, not after its binary
WANT_W=1440
WANT_H=900
LOAD_WAIT=6
