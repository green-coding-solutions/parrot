# GENERATED by tools/make_block_scenarios.py from usage_scenario_normalized.yml. Do not edit:
# change that file or the recording, then rerun the tool.
#
# Replays st-normalized.parrot one block per flow step, so every block
# of the group's script.md is a GMT phase of its own. Block 1 starts the app;
# every later block continues it as the block before left it (replay.py --block).
#
name: Parrot st (time-normalized, per block)
author: Didi <didi@green-coding.io>
description: Drives st through the same sixteen-block session, time-normalized so every block lasts as long as the slowest entrant's. Every block is its own flow step

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    setup-commands:
      - command: bash /tmp/repo/applications/terminals/st/install.sh
      # WM_CLASS(STRING) = "st-256color", "st-256color" - st names itself
      # after its TERM, which is neither the binary name (st) nor the package
      # name (stterm). Measured; guessing 'st' here matches nothing.
      - command: bash /tmp/repo/applications/terminals/common/pin-windows.sh st-256color 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Load app
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/terminals/st/st-normalized.parrot --block 1
        read-notes-stdout: true
  - name: Print a file
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/terminals/st/st-normalized.parrot --block 2
        read-notes-stdout: true
