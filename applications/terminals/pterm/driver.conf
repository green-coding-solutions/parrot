# Per-app values for common/drive-scenario.sh.
# WM_CLASS(STRING) = "pterm", "Pterm"
CLASS=pterm
WANT_W=1440
WANT_H=900
LOAD_WAIT=8

# pterm needs longer per block than the Xlib entrants. Its first recording warned
# that both 'plain' and 'seq' had not logged after the 8 s default, so those two
# checkpoints were taken mid-scroll. Measured worst block: 18,726 ms (seq).
#
# 25 s, not the 47 s a 2.5x margin would give. THE MARGIN HERE COSTS SIGNAL, not
# just wall-clock: normalization pads every block in every entrant to the group
# maximum, and pterm is that maximum, so pterm's wait alone decides how much of
# EVERY app's run is idle. At 47 s the six fast entrants were 27% busy and the
# normalized runs were 622 s; at 25 s they are ~58% busy and the runs are ~350 s.
#
# 1.3x margin on the worst block is deliberately tighter than elsewhere. The RUN
# assertion in the driver is what makes that safe to do - if a block ever fails
# to log inside the wait, it warns at record time rather than producing a
# half-drawn reference screenshot.
#
# The longer wait does not bias the comparison - the recordings are
# time-normalized afterwards, which pads every block to the group maximum.
BLOCK_WAIT=25
