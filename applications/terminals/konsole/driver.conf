# Per-app values for common/drive-scenario.sh.
# WM_CLASS(STRING) = "konsole", "konsole"
CLASS=konsole
WANT_W=1440
WANT_H=900
LOAD_WAIT=10

# Konsole needs far longer per block than the Xlib entrants, and this is a
# measured property of the app rather than a safety margin. Timed inside its own
# window against the same corpus:
#
#             xterm     konsole
#   plain     1,501 ms  5,087 ms
#   longlines 1,471 ms  3,750 ms
#   seq       1,487 ms  9,588 ms   <-- overran the 8 s default
#
# The first recording warned that `seq` had not logged after 8 s, so its block-10
# checkpoint was taken mid-scroll. 25 s is 2.6x the worst measured block.
#
# A longer wait here does not bias the comparison: the recordings are
# time-normalized afterwards, which pads every block to the group maximum, so the
# idle is equalised across all entrants regardless of what each driver waited.
BLOCK_WAIT=25
