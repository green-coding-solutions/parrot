name: Parrot SoftMaker FreeOffice TextMaker
author: Didi <didi@green-coding.io>
description: Drives SoftMaker FreeOffice TextMaker through a 98-page ODT using Parrot

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    setup-commands:
      - command: bash /tmp/repo/applications/wordprocessors/freeoffice/install.sh
      # Deterministic window geometry, and a fluxbox keys file with no keyboard
      # bindings at all - the default one grabs Control+F1..F12 for workspace
      # switching, which silently steals shortcuts from the application. Must
      # run BEFORE entrypoint.sh: fluxbox reads its configuration once at
      # startup and will not replace files that are already there.
      #
      # res_name is `tm`, NOT `textmaker24free`. The binary, the package and the
      # .desktop file are all called textmaker24free and the window is not:
      # WM_CLASS is "tm", "tm". Measured the expensive way - with
      # (name=textmaker24free) the window came back 1080x675 at 180,144 and
      # fluxbox said nothing at all. Read back after the fix:
      #   [Untitled 1 - TextMaker] X=0 Y=0 WIDTH=1440 HEIGHT=900
      - command: bash /tmp/repo/applications/wordprocessors/common/pin-windows.sh tm 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Run Benchmark
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/freeoffice/freeoffice.parrot
        read-notes-stdout: true
