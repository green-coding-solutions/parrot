# GENERATED by tools/make_block_scenarios.py from usage_scenario_normalized.yml. Do not edit:
# change that file or the recording, then rerun the tool.
#
# Replays libreoffice-normalized.parrot one block per flow step, so every block
# of the group's script.md is a GMT phase of its own. Block 1 starts the app;
# every later block continues it as the block before left it (replay.py --block).
#
# TIME-NORMALIZED VARIANT - use this one to COMPARE APPS, not the one beside it.
#
# Identical to usage_scenario.yml in every respect except the recording it
# replays. `tools/check_blocks.py --normalize-time` pads every block of every
# recording in the group out to the longest that block takes in ANY of them, so
# all six runs are 1269.515 s and every one of the eighteen blocks occupies the
# same wall-clock in each. The padding is a single `wait` inserted immediately
# before the block's checkpoint, so the timing of the actions inside a block is
# untouched - only the settled idle at the end of the block grows.
#
# WHY THIS EXISTS
#
# 96-99 % of every recording in this group is deliberate `wait`, and the drivers
# were paced per app to whatever that app needed to settle. Un-normalized totals
# run from 445 s (LibreOffice) to 1173 s (Collabora) - a 2.6x spread that is
# mostly the driver's safety margin rather than the application. Each scenario
# is a single flow command, so GMT reports one phase covering the whole replay:
# comparing those figures across apps largely ranks how patient each driver is.
# Normalizing removes that, at the cost of every app now paying the slowest
# app's idle in every block.
#
# Regenerate after ANY re-recording - the padding is computed across the whole
# group, so one new recording changes all six:
#
#   ./tools/check_blocks.py applications/wordprocessors --normalize-time
#
name: Parrot LibreOffice Writer (time-normalized, per block)
author: Didi <didi@green-coding.io>
description: Drives LibreOffice Writer through a 98-page ODT using Parrot, with every block padded to the group-wide maximum. Every block is its own flow step

services:
  window-container:
    image: ribalba/xwindow-server
    # ports:
    #   - "6080:6080" # noVNC (open in browser)
    #   - "5900:5900" # raw VNC
    environment:
      # DEBUG: 1
      RESOLUTION: 1440x900

    setup-commands:
      - command: bash /tmp/repo/applications/wordprocessors/libreoffice/install.sh
      # Deterministic window geometry.  Must run BEFORE entrypoint.sh: fluxbox
      # reads ~/.fluxbox/apps once at startup and will not replace an existing
      # file.
      #
      # The res_name and nothing else.  Adding the res_class the settled window
      # reports (libreoffice-writer) makes the rule match NOTHING - fluxbox
      # evaluates it at map time, before Writer has set its final class or
      # title.  Measured; see the table in pin-windows.sh.
      #
      # Writer's dialogs share the res_name, so this rule matches them too, and
      # that is safe here: they are transient, which makes fluxbox centre them on
      # their parent whatever [Position] says, and they carry a program-specified
      # maximum size, which clamps [Dimensions].  Find and Replace stays 574x403
      # centred with this rule active.
      - command: bash /tmp/repo/applications/wordprocessors/common/pin-windows.sh libreoffice 1440 900
      - command: bash /usr/local/bin/entrypoint.sh

flow:
  - name: Load app
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/libreoffice/libreoffice-normalized.parrot --block 1
        read-notes-stdout: true
  - name: Open document
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/libreoffice/libreoffice-normalized.parrot --block 2
        read-notes-stdout: true
  - name: Page through
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/libreoffice/libreoffice-normalized.parrot --block 3
        read-notes-stdout: true
  - name: Jump to end
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/libreoffice/libreoffice-normalized.parrot --block 4
        read-notes-stdout: true
  - name: Jump to start
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/libreoffice/libreoffice-normalized.parrot --block 5
        read-notes-stdout: true
  - name: Zoom
    container: window-container
    commands:
      - type: console
        command: python3 /usr/local/bin/replay.py /tmp/repo/applications/wordprocessors/libreoffice/libreoffice-normalized.parrot --block 6
        read-notes-stdout: true
  - name: Find word
    container: window-container
